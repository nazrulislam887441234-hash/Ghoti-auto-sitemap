name = "ghoti-auto-sitemap"
main = "src/index.js"
compatibility_date = "2024-10-01"

[vars]
FIREBASE_PROJECT_ID = "ghotimarket"

[[routes]]
pattern = "ghotimarket.com/product-sitemap.xml"
zone_name = "ghotimarket.com"

[[routes]]
pattern = "ghotimarket.com/sitemap-products*"
zone_name = "ghotimarket.com"

[[routes]]
pattern = "www.ghotimarket.com/product-sitemap.xml"
zone_name = "ghotimarket.com"

[[routes]]
pattern = "www.ghotimarket.com/sitemap-products*"
zone_name = "ghotimarket.com"
